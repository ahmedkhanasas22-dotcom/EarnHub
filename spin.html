<!DOCTYPE html>
<html>
<head>
<title>Spin & Win - EarnHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
margin:0; max-width:430px; margin:auto;
font-family:Arial, sans-serif; background:#050505; color:white;
min-height:100vh; display: flex; flex-direction: column; justify-content: space-between;
padding: 15px; text-align: center;
}
.top-bar {
display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
}
.back-btn, .history-btn { font-size: 20px; cursor: pointer; color: #00ffff; text-decoration: none; }
.title-box h3 { color: #aaa; margin: 0; font-size: 13px; }
.title-box h1 { color: #00ffff; margin: 5px 0 0 0; font-size: 20px; }
.timer-display { font-size: 12px; color: #ffeb3b; margin-top: 5px; font-weight: bold; }

/* Wheel Wrapper */
.wheel-container {
position: relative; width: 320px; height: 320px; margin: 20px auto;
}
.pin {
position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
width: 35px; height: 45px; background: #00ffff; clip-path: polygon(50% 100%, 0 0, 100% 0);
z-index: 10; border: 2px solid #fff; filter: drop-shadow(0 0 5px rgba(0,255,255,0.8));
}
.wheel {
width: 100%; height: 100%; border-radius: 50%;
border: 6px solid #00ffff; position: relative; overflow: hidden;
transition: transform 10s cubic-bezier(0.15, 0, 0.15, 1);
background: conic-gradient(
#ffeb3b 0deg 45deg, 
#33e1ed 45deg 90deg, 
#ff4081 90deg 135deg, 
#d1c4e9 135deg 180deg, 
#1de9b6 180deg 225deg, 
#ab47bc 225deg 270deg, 
#ff9800 270deg 315deg, 
#ff5722 315deg 360deg
);
box-shadow: 0 0 25px rgba(0,255,255,0.4);
}

.wheel svg {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
}

.center-hub {
position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
width: 50px; height: 50px; background: #00ffff; border-radius: 50%;
border: 3px solid #fff; display: flex; align-items: center; justify-content: center;
font-weight: bold; color: #000; font-size: 18px; box-shadow: 0 0 10px rgba(0,0,0,0.5);
z-index: 5;
}

/* Spin Button */
.spin-action-btn {
background: #f0f0f5; color: #333; width: 100%; padding: 16px;
border-radius: 30px; font-size: 16px; font-weight: bold; border: none;
cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding-left: 25px; padding-right: 25px;
box-shadow: 0 4px 15px rgba(255,255,255,0.2);
}
.spin-action-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
.spin-action-btn span:last-child { font-size: 20px; }
.terms { font-size: 11px; color: #aaa; margin-top: 10px; line-height: 1.4; }
.terms a { color: #00ffff; text-decoration: none; }
#message { color: #00ffff; font-weight: bold; min-height: 25px; font-size: 14px; margin-top: 5px;}

/* Custom Popup Modal Styles */
.custom-modal-overlay {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center;
z-index: 9999; padding: 20px;
}
.custom-modal-box {
background: #111; border: 2px solid #00ffff; border-radius: 18px; width: 100%; max-width: 340px;
padding: 20px; text-align: center; box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
}
.modal-logo {
width: 50px; height: 50px; border-radius: 50%; background: #00ffff;
display: flex; align-items: center; justify-content: center; margin: 0 auto 10px auto;
color: #000; font-weight: bold; font-size: 20px; box-shadow: 0 0 10px rgba(0,255,255,0.8);
}
.modal-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 2px; }
.modal-title span { color: #00ffff; }
.modal-text { font-size: 14px; color: #ddd; line-height: 1.5; margin: 15px 0 20px 0; direction: rtl; }
.modal-ok-btn {
background: #00ffff; color: #000; border: none; width: 100%; padding: 12px;
border-radius: 25px; font-weight: bold; font-size: 15px; cursor: pointer;
box-shadow: 0 0 10px rgba(0,255,255,0.5);
}
</style>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>

<div class="top-bar">
<a href="dashboard.html" class="back-btn">←</a>
<div class="title-box">
<h3>Try your Luck</h3>
<h1>Spin The Wheel</h1>
</div>
<div>
<a href="withdraw-history.html" class="history-btn">🕒</a>
<div class="timer-display" id="timerDisplay"></div>
</div>
</div>

<div id="message"></div>

<div class="wheel-container">
<div class="pin"></div>
<div class="wheel" id="wheel">
  <svg viewBox="0 0 320 320">
    <g font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#000" text-anchor="middle">
      <text x="160" y="65" transform="rotate(22.5 160 160)">Rs. 10</text>
      <text x="160" y="65" transform="rotate(67.5 160 160)">Rs. 2</text>
      <text x="160" y="65" transform="rotate(112.5 160 160)">Rs. 5</text>
      <text x="160" y="65" transform="rotate(157.5 160 160)">Rs. 10</text>
      <text x="160" y="65" transform="rotate(202.5 160 160)">Rs. 2</text>
      <text x="160" y="65" transform="rotate(247.5 160 160)">Rs. 5</text>
      <text x="160" y="65" transform="rotate(292.5 160 160)">Rs. 10</text>
      <text x="160" y="65" transform="rotate(337.5 160 160)">Rs. 2</text>
    </g>
  </svg>
</div>
<div class="center-hub">⚡</div>
</div>

<div>
<button class="spin-action-btn" id="spinBtn" onclick="startSpin()">
<span>Spin the Wheel (Fee: Rs. 1)</span>
<span>➔</span>
</button>
<div class="terms">
By tapping on "Spin the Wheel" you agree to the <a href="#">Terms & Conditions</a>.
</div>
</div>

<!-- Custom Popup Modal HTML -->
<div class="custom-modal-overlay" id="customModal">
    <div class="custom-modal-box">
        <div class="modal-logo">EH</div>
        <div class="modal-title">Earn<span>Hub</span></div>
        <div class="modal-text" id="modalMessageText">نوٹیفیکیشن: اسپن کرنے کے لیے آپ کے اکاؤنٹ میں کم از کم 1 روپیہ ہونا ضروری ہے۔</div>
        <button class="modal-ok-btn" onclick="closeCustomModal()">OK</button>
    </div>
</div>

<script>
const allowedPrizes = [
{text: "Rs. 2", angle: 67.5, amount: 2},
{text: "Rs. 5", angle: 112.5, amount: 5},
{text: "Rs. 10", angle: 22.5, amount: 10},
{text: "Rs. 2", angle: 202.5, amount: 2},
{text: "Rs. 5", angle: 247.5, amount: 5},
{text: "Rs. 10", angle: 157.5, amount: 10}
];

function showCustomModal(message) {
    document.getElementById("modalMessageText").innerText = message;
    document.getElementById("customModal").style.display = "flex";
}

function closeCustomModal() {
    document.getElementById("customModal").style.display = "none";
}

// فائر بیس سے لائیو بیلنس لانے کا فنکشن
async function getAccountData() {
    try {
        if (typeof firebase !== 'undefined' && firebase.auth().currentUser) {
            let uid = firebase.auth().currentUser.uid;
            let docRef = await firebase.firestore().collection("users").doc(uid).get();
            if (docRef.exists) {
                let data = docRef.data();
                let bal = data.mainBalance !== undefined ? Number(data.mainBalance) : Number(data.balance || 0);
                let lastSpin = data.lastSpinDate || "";
                return { balance: bal, lastSpinDate: lastSpin };
            }
        }
    } catch (err) {
        console.log("Firebase fetch error:", err);
    }
    
    let localBal = Number(localStorage.getItem("mainBalance") || "0");
    let localSpin = localStorage.getItem("lastSpinDate") || "";
    return { balance: localBal, lastSpinDate: localSpin };
}

// فائر بیس اور لوکل سٹوریج میں بیلنس محفوظ کرنے کا فنکشن
async function saveAccountData(newBalance, spinDate) {
    localStorage.setItem("mainBalance", newBalance);
    if (spinDate) {
        localStorage.setItem("lastSpinDate", spinDate);
    }

    try {
        if (typeof firebase !== 'undefined' && firebase.auth().currentUser) {
            let uid = firebase.auth().currentUser.uid;
            let updateData = {
                mainBalance: newBalance,
                balance: newBalance
            };
            if (spinDate) {
                updateData.lastSpinDate = spinDate;
            }
            await firebase.firestore().collection("users").doc(uid).update(updateData);
        }
    } catch (err) {
        console.log("Firebase save error:", err);
    }
}

async function updateUI() {
    let data = await getAccountData();
    let todayDate = new Date().toDateString();
    let spinBtn = document.getElementById("spinBtn");

    if (data.lastSpinDate === todayDate) {
        spinBtn.disabled = true;
        spinBtn.style.background = "#444";
        document.getElementById("message").innerText = "You have already spun today. Come back after 12:00 AM!";
    } else {
        spinBtn.disabled = false;
        spinBtn.style.background = "#f0f0f5";
        document.getElementById("message").innerText = "";
    }
}

function updateTimer() {
    let now = new Date();
    let midnight = new Date();
    midnight.setHours(24, 0, 0, 0); 

    let diff = midnight - now;
    if (diff <= 0) {
        document.getElementById("timerDisplay").innerText = "Ready!";
        return;
    }

    let hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    let minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    let seconds = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById("timerDisplay").innerText = 
        (hours < 10 ? "0" + hours : hours) + ":" + 
        (minutes < 10 ? "0" + minutes : minutes) + ":" + 
        (seconds < 10 ? "0" + seconds : seconds);
}

// پیج لوڈ پر تصدیق
if (typeof firebase !== 'undefined') {
    firebase.auth().onAuthStateChanged(async (user) => {
        if (user) {
            await updateUI();
        } else {
            window.location.href = "index.html";
        }
    });
} else {
    updateUI();
}

setInterval(updateTimer, 1000);
updateTimer();

async function startSpin() {
    let data = await getAccountData();
    let todayDate = new Date().toDateString();

    if (data.lastSpinDate === todayDate) {
        showCustomModal("آپ آج کا اسپن پہلے ہی کر چکے ہیں! براہ کرم کل کا انتظار کریں۔");
        return;
    }

    if (data.balance < 1) {
        showCustomModal("نوٹیفیکیشن: اسپن کرنے کے لیے آپ کے اکاؤنٹ میں کم از کم 1 روپیہ ہونا ضروری ہے۔");
        return;
    }

    let spinBtn = document.getElementById("spinBtn");
    spinBtn.disabled = true;
    spinBtn.style.background = "#444";
    document.getElementById("message").innerText = "Spinning... Please wait!";

    // رینڈم پرائز سلलेक्ट کریں
    let randomPrize = allowedPrizes[Math.floor(Math.random() * allowedPrizes.length)];
    let extraSpins = 360 * 10;
    let totalRotation = extraSpins + (360 - randomPrize.angle);

    let wheel = document.getElementById("wheel");
    wheel.style.transform = "rotate(" + totalRotation + "deg)";

    // 10 سیکنڈ بعد جب ویل رک جائے گا
    setTimeout(async () => {
        // فیس کٹنے اور انعامی رقم پلس کرنے کا حساب ایک ساتھ لگائیں
        let freshData = await getAccountData();
        let finalBalance = freshData.balance - 1 + Number(randomPrize.amount);
        
        // فائر بیس اور لوکل سٹوریج میں محفوظ کریں
        await saveAccountData(finalBalance, todayDate);
        
        updateUI();

        document.getElementById("message").innerText = "Congratulations! You won " + randomPrize.text + " 🎉";
    }, 10000); 
}
</script>

</body>
</html>
