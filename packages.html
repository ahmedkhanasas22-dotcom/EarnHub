<!DOCTYPE html>
<html>
<head>
<title>EarnHub Investment Plans</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{ box-sizing:border-box; }
body{ margin:0; max-width:430px; margin:auto; font-family:Arial; background:#050505; color:white; padding-bottom: 30px; }
.header{ text-align:center; padding:15px; }
.unique-logo{ display:flex; align-items:center; justify-content:center; gap:14px; font-family:Arial,sans-serif; margin: 10px 0; }
.unique-icon{ width:60px; height:60px; border-radius:50%; background: linear-gradient(135deg,#00ffff,#0048ff); display:flex; align-items:center; justify-content:center; box-shadow: 0 0 20px #00ffff; }
.eh-symbol{ width:44px; height:44px; border-radius:50%; background:#050505; display:flex; align-items:center; justify-content:center; color:#ffd700; font-size:16px; font-weight:900; border:2px solid #ffd700; }
.unique-text h1{ margin:0; font-size:24px; font-weight:900; color:white; text-align: left; }
.unique-text h1 span{ color:#00ffff; }
.unique-text p{ margin:2px 0 0 0; color:#ffd700; font-size:8px; letter-spacing:1.5px; text-align: left; }
.container{ padding:12px; }
.title{ text-align:center; color:#00ffff; font-size:20px; font-weight:bold; margin-bottom:15px; }
.package{ background:#111; padding:15px; margin-bottom:12px; border-radius:18px; box-shadow:0 0 12px rgba(0,255,255,0.3); border:1px solid #00ffff; }
.package h2{ color:#00ffff; font-size:18px; margin:0 0 12px 0; text-align:center; border-bottom:1px solid #333; padding-bottom:6px; }
.plan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 5px; }
.plan-item { background: #161f2d; padding: 8px 10px; border-radius: 10px; border: 1px solid #333; }
.plan-label { font-size: 12px; color: #888; margin-bottom: 4px; }
.plan-value { font-size: 14px; font-weight: bold; color: #fff; }
.return-value { color: #00ff99 !important; }
button{ width:100%; padding:10px; margin-top:12px; border:none; border-radius:25px; background:linear-gradient(135deg,#00ffff,#1a73e8); font-weight:bold; font-size:14px; cursor:pointer; color:#000; box-shadow: 0 4px 10px rgba(0,255,255,0.2); }
.back-btn { display: inline-block; margin-bottom: 10px; color: #00ffff; font-size: 13px; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>

<div class="header">
<div class="unique-logo">
    <div class="unique-icon"><div class="eh-symbol">E↗H</div></div>
    <div class="unique-text">
        <h1>Earn<span>Hub</span></h1>
        <p>SMART MONEY NETWORK</p>
    </div>
</div>
</div>

<div class="container">
<a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
<div class="title">Investment Plans</div>

<!-- Plan 01 -->
<div class="package">
    <h2>Plan 01</h2>
    <div class="plan-grid">
        <div class="plan-item"><div class="plan-label">Investment</div><div class="plan-value">Rs. 220</div></div>
        <div class="plan-item"><div class="plan-label">Daily Earn</div><div class="plan-value">Rs. 14.67</div></div>
        <div class="plan-item"><div class="plan-label">Duration</div><div class="plan-value">30 Days</div></div>
        <div class="plan-item"><div class="plan-label">Total Earn</div><div class="plan-value return-value">Rs. 440</div></div>
    </div>
    <button onclick="buyPlan('Plan 01', 220, 14.67, 30)">Invest Now</button>
</div>

<!-- Plan 02 -->
<div class="package">
    <h2>Plan 02</h2>
    <div class="plan-grid">
        <div class="plan-item"><div class="plan-label">Investment</div><div class="plan-value">Rs. 450</div></div>
        <div class="plan-item"><div class="plan-label">Daily Earn</div><div class="plan-value">Rs. 30.00</div></div>
        <div class="plan-item"><div class="plan-label">Duration</div><div class="plan-value">30 Days</div></div>
        <div class="plan-item"><div class="plan-label">Total Earn</div><div class="plan-value return-value">Rs. 900</div></div>
    </div>
    <button onclick="buyPlan('Plan 02', 450, 30, 30)">Invest Now</button>
</div>
</div>

<script>
function buyPlan(planName, price, dailyEarn, duration) {
    let activePackage = localStorage.getItem("activePackage") || "";
    let packages = activePackage.split(/[,+]+/).map(p => p.trim()).filter(p => p.length > 0);

    if (packages.includes(planName)) {
        let isCompleted = localStorage.getItem(planName + "_completed") === "true";
        if (!isCompleted) {
            alert("آپ نے یہ پلان (" + planName + ") پہلے سے خریدا ہوا ہے! جب تک یہ مکمل نہیں ہوتا آپ اسے دوبارہ نہیں خرید سکتے۔");
            return;
        }
    }

    let currentBalance = parseFloat(localStorage.getItem("mainBalance")) || 0;
    if (currentBalance >= price) {
        currentBalance -= price;
        localStorage.setItem("mainBalance", currentBalance);

        if (!packages.includes(planName)) {
            packages.push(planName);
        }
        localStorage.setItem("activePackage", packages.join(", "));
        localStorage.setItem("isAdminApproved", "true"); 
        
        localStorage.setItem(planName + "_daily", dailyEarn);
        localStorage.setItem(planName + "_duration", duration);
        localStorage.setItem(planName + "_startDate", new Date().toISOString());
        
        localStorage.removeItem(planName + "_completed");
        localStorage.removeItem(planName + "_currentDay");

        // ریفرل کمیشن چیک (صرف اس وقت ایڈ ہوگا جب یوزر پہلی بار پیکج بائے کرے اور کسی کے ریفرل سے آیا ہو)[span_0](start_span)[span_0](end_span)
        let hasPurchased = localStorage.getItem("hasPurchasedPackage");
        let referredBy = localStorage.getItem("referredBy");
        
        if (hasPurchased !== "true" && referredBy) {
            localStorage.setItem("hasPurchasedPackage", "true");
            let currentRefs = Number(localStorage.getItem("totalReferrals") || 0) + 1;
            localStorage.setItem("totalReferrals", currentRefs);
            let currentBal = Number(localStorage.getItem("mainBalance") || 0);
            localStorage.setItem("mainBalance", currentBal + 50);
        }

        let transList = JSON.parse(localStorage.getItem('allTransactions') || "[]");
        transList.unshift({type: "Package Purchase", amount: -price, details: planName, date: new Date().toLocaleString()});
        localStorage.setItem('allTransactions', JSON.stringify(transList));

        alert(planName + " successfully buy ho gaya hai!");
        window.location.href = "dashboard.html";
    } else {
        alert("Aapke main balance mein na-kaafi rakam hai! Pehle deposit karein.");
        window.location.href = "deposit.html";
    }
}
</script>
</body>
</html>
