<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnHub Claim</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #050505;
            color: #fff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            max-width: 430px;
            margin: auto;
        }
        
        .unique-logo{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:14px;
            font-family:Arial,sans-serif;
            margin: 10px 0;
        }

        .unique-icon{
            width:60px;
            height:60px;
            border-radius:50%;
            background: linear-gradient(135deg,#00ffff,#0048ff);
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow: 0 0 20px #00ffff;
        }

        .eh-symbol{
            width:44px;
            height:44px;
            border-radius:50%;
            background:#050505;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#ffd700;
            font-size:16px;
            font-weight:900;
            border:2px solid #ffd700;
        }

        .unique-text h1{
            margin:0;
            font-size:24px;
            font-weight:900;
            color:white;
            text-align: left;
        }

        .unique-text h1 span{
            color:#00ffff;
        }

        .unique-text p{
            margin:2px 0 0 0;
            color:#ffd700;
            font-size:8px;
            letter-spacing:1.5px;
            text-align: left;
        }

        .container {
            width: 100%;
            background: #111;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 0 12px cyan;
        }
        .section-heading {
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #00ffff;
        }
        .pkg-section {
            background: #161f2d;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #00ffff;
        }
        .day-card {
            background: #1c2638;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        .day-info h4 {
            font-size: 14px;
            color: #fff;
            margin: 0;
        }
        .day-info p {
            font-size: 12px;
            color: #00ff99;
            margin: 2px 0 0 0;
        }
        .btn-action{
            background:#00ffff;
            color:#000;
            border:none;
            padding:6px 12px;
            border-radius:15px;
            font-weight:bold;
            font-size:11px;
            cursor:pointer;
        }
        .btn-action:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .status-collected {
            color: #00ff99;
            font-size: 11px;
            font-weight: bold;
        }
        .status-expired {
            color: #ff4d4d;
            font-size: 11px;
            font-weight: bold;
        }
        .status-locked {
            color: #f39c12;
            font-size: 11px;
            font-weight: bold;
            text-align: right;
        }
        .notice-box {
            text-align: center;
            padding: 15px 10px;
            color: #00ff99;
            font-weight: bold;
            font-size: 13px;
            background: rgba(0, 255, 153, 0.1);
            border-radius: 12px;
            border: 1px dashed #00ff99;
            margin: 10px 0;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #00ffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="unique-logo">
        <div class="unique-icon">
            <div class="eh-symbol">
                E↗H
            </div>
        </div>
        <div class="unique-text">
            <h1>Earn<span>Hub</span></h1>
            <p>SMART MONEY NETWORK</p>
        </div>
    </div>

    <div class="container">
        <div class="section-heading" id="packageTitle">Daily Claim Box</div>
        <div id="claimBoxContainer">
            <div style="text-align:center; padding:20px; color:#aaa;">Loading from Firebase...</div>
        </div>
    </div>

    <a class="back-link" href="dashboard.html">⬅ Back to Dashboard</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBsXMyLONHGs0R7wzAz5MI7ozw0SRBYEvI",
    authDomain: "earnhub-55c59.firebaseapp.com",
    projectId: "earnhub-55c59",
    storageBucket: "earnhub-55c59.firebasestorage.app",
    messagingSenderId: "636270810711",
    appId: "1:636270810711:web:da2bb0625524bcddc27512"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUserData = null;
let currentUserId = null;

onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUserId = user.uid;
        await fetchUserData();
    } else {
        document.getElementById("claimBoxContainer").innerHTML = "<div style='text-align:center; padding:20px; color:#ff4d4d;'>Pehle Login karein!</div>";
    }
});

async function fetchUserData() {
    if (!currentUserId) return;
    try {
        let docSnap = await getDoc(doc(db, "users", currentUserId));
        if (docSnap.exists()) {
            currentUserData = docSnap.data();
            renderClaimBox();
        }
    } catch (e) {
        console.error("Error fetching user data:", e);
    }
}

function getMidnightDate(dateInput) {
    let d = new Date(dateInput);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
}

window.renderClaimBox = function() {
    let container = document.getElementById("claimBoxContainer");
    let titleBox = document.getElementById("packageTitle");

    if (!currentUserData || !currentUserData.activePackages || currentUserData.activePackages.length === 0) {
        titleBox.innerText = "No Active Package";
        container.innerHTML = "<div style='text-align:center; padding:20px; color:#aaa;'>Pehle koi investment plan khareedें!</div>";
        return;
    }

    titleBox.innerText = "Active Packages Box";
    let html = "";
    let now = new Date();
    let todayMidnight = getMidnightDate(now);

    currentUserData.activePackages.forEach((pkg, pkgIndex) => {
        let startMidnight = getMidnightDate(pkg.startDate);
        let daysPassed = Math.floor((todayMidnight - startMidnight) / (1000 * 60 * 60 * 24)) + 1;
        if (daysPassed < 1) daysPassed = 1;

        html += `
        <div class="pkg-section">
            <h3 style="color:#00ffff; margin-bottom:8px; border-bottom:1px solid #333; padding-bottom:5px;">
                ${pkg.name}
            </h3>
        `;

        let claimedDays = pkg.claimedDays || [];

        for (let d = 1; d <= pkg.totalDays; d++) {
            let isCollected = claimedDays.includes(d);
            let isExpired = d < daysPassed && !isCollected;

            if (isCollected) {
                html += `
                <div class="day-card">
                    <div class="day-info">
                        <h4>Day ${d}</h4>
                        <p>Rs. ${pkg.dailyEarn.toFixed(2)}</p>
                    </div>
                    <span class="status-collected">✔ Collected</span>
                </div>
                `;
            } else if (isExpired) {
                html += `
                <div class="day-card">
                    <div class="day-info">
                        <h4>Day ${d}</h4>
                        <p>Rs. ${pkg.dailyEarn.toFixed(2)}</p>
                    </div>
                    <span class="status-expired">❌ Missed (Expired)</span>
                </div>
                `;
            } else if (d === daysPassed) {
                html += `
                <div class="day-card">
                    <div class="day-info">
                        <h4>Day ${d}</h4>
                        <p>Rs. ${pkg.dailyEarn.toFixed(2)}</p>
                    </div>
                    <button class="btn-action" id="claim-btn-${pkgIndex}-${d}" onclick="claimDay(${pkgIndex}, ${d}, ${pkg.dailyEarn})">
                        Claim Rs. ${pkg.dailyEarn.toFixed(2)}
                    </button>
                </div>
                `;
            } else {
                html += `
                <div class="day-card">
                    <div class="day-info">
                        <h4>Day ${d}</h4>
                        <p>Rs. ${pkg.dailyEarn.toFixed(2)}</p>
                    </div>
                    <span class="status-locked">Locked</span>
                </div>
                `;
            }
        }

        if (daysPassed > pkg.totalDays) {
            html += `
                <div class="notice-box" style="margin-top:10px;">
                    ${pkg.name} Package Successful 🎉 Completed! Ab dobara buy kar sakte hain.
                </div>
            `;
        }

        html += `</div>`;
    });

    container.innerHTML = html;
}

// فائر بیس لائیو کلیم فنکشن
window.claimDay = async function(pkgIndex, currentDay, amount) {
    if (!currentUserId || !currentUserData) return;

    let btn = document.getElementById(`claim-btn-${pkgIndex}-${currentDay}`);
    if (btn) {
        btn.disabled = true;
        btn.innerText = "Processing...";
    }

    try {
        let activePackages = currentUserData.activePackages;
        let targetPkg = activePackages[pkgIndex];

        if (!targetPkg.claimedDays) {
            targetPkg.claimedDays = [];
        }

        if (targetPkg.claimedDays.includes(currentDay)) {
            alert("Yeh din pehle hi claim ho chuka hai!");
            return;
        }

        targetPkg.claimedDays.push(currentDay);

        let currentBalance = parseFloat(currentUserData.mainBalance) || 0;
        let newBalance = currentBalance + amount;

        // فائر بیس پر بیلنس اور پیکج کا ڈیٹا لائیو اپ ڈیٹ کریں
        let userDocRef = doc(db, "users", currentUserId);
        await updateDoc(userDocRef, {
            mainBalance: newBalance,
            activePackages: activePackages
        });

        // لوکل ڈیٹا اپ ڈیٹ کریں اور پیج ری-رینڈر کریں
        currentUserData.mainBalance = newBalance;
        currentUserData.activePackages = activePackages;

        alert("✅ رقم کامیابی سے فائر بیس پر کلیم ہو گئی ہے!");
        renderClaimBox();

    } catch (err) {
        console.error("Claim error:", err);
        alert("Claim karne mein masla hua, dobara koshish karein!");
        if (btn) {
            btn.disabled = false;
            btn.innerText = `Claim Rs. ${amount.toFixed(2)}`;
        }
    }
}
</script>

</body>
</html>
