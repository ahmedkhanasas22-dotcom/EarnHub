<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ten Rupee Game - EarnHub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7f8fa;
            color: #111;
            padding: 15px;
        }

        .game-main-container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        /* Top Header Navigation style */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
            color: #111;
        }

        .top-nav h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .info-icon {
            font-size: 18px;
            color: #555;
            cursor: pointer;
        }

        /* Main Titles */
        .main-title {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 8px;
            color: #111;
        }

        .sub-desc {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* Participant Badge */
        .badge-participated {
            display: inline-flex;
            align-items: center;
            background: #eaf5ec;
            color: #27ae60;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Products Grid/List Container */
        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Product Card */
        .product-card {
            background: #f4f5f7;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            position: relative;
            border: 1px solid #eaeaea;
        }

        .product-img-box {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .product-img-box img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .product-name {
            font-size: 17px;
            font-weight: 700;
            color: #222;
            margin-bottom: 8px;
            text-align: left;
        }

        .price-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            text-align: left;
        }

        /* اصل قیمت پر کراس لائن */
        .fake-price {
            font-size: 14px;
            color: #888;
            text-decoration: line-through;
        }

        /* آفر والی قیمت (10 روپے) */
        .actual-price {
            font-size: 14px;
            font-weight: 700;
            color: #27ae60;
        }

        /* Buy Button */
        .buy-btn {
            width: 100%;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.2);
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background-color: #219653;
        }

        .buy-btn:disabled {
            background-color: #7f8c8d !important;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* نیچے والی السٹریشن کی بہترین سیٹنگ */
        .illustration-box {
            text-align: center;
            margin-top: 15px;
        }

        .illustration-box img {
            width: 100%;
            max-width: 320px;
            height: auto;
            object-fit: contain;
        }

        /* کسٹم پاپ اپ ماڈل ڈیزائن */
        .custom-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .custom-modal-box {
            background: #ffffff;
            width: 100%;
            max-width: 320px;
            border-radius: 16px;
            border: 2px solid #27ae60;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .custom-modal-text {
            color: #111;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.4;
            font-weight: 600;
        }
        .custom-modal-btn {
            background: #27ae60;
            color: #fff;
            border: none;
            padding: 8px 25px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-main-container">
        <!-- Top Nav -->
        <div class="top-nav">
            <span class="back-btn" onclick="history.back()">&#10094;</span>
            <h2>Ten Rupee Game</h2>
            <span class="info-icon">&#9432;</span>
        </div>

        <!-- Headings -->
        <h1 class="main-title">Get items worth a fortune for just <span class="currency-price" data-base-usd="10">Rs. 10</span></h1>
        <p class="sub-desc">Simply select a product from below and purchase it for the price for <span class="currency-price" data-base-usd="10">Rs. 10</span> and get a chance to win.</p>

        <!-- Participants Count Badge -->
        <div>
            <span class="badge-participated">⭐ <span id="participantCount">592812</span> have participated</span>
        </div>

        <!-- Products List / Grid -->
        <div class="products-grid">
            <!-- Item 1: Samsung Galaxy A54 -->
            <div class="product-card">
                <div class="product-img-box">
                    <img src="https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=400&auto=format&fit=crop&q=60" alt="Samsung Galaxy A54">
                </div>
                <div class="product-name">Samsung Galaxy a54</div>
                
                <!-- قیمت का درست فارمیٹ -->
                <div class="price-box">
                    <span class="fake-price">Price: <span class="currency-price" data-base-usd="80000">Rs. 80,000</span></span>
                    <span class="actual-price"><span class="currency-price" data-base-usd="10">Rs. 10</span></span>
                </div>

                <button class="buy-btn" id="buyBtn1" onclick="participateGame('buyBtn1', 'Samsung Galaxy a54')">Buy for <span class="currency-price" data-base-usd="10">Rs. 10</span></button>
            </div>
        </div>

        <!-- Bottom Graphic Illustration -->
        <div class="illustration-box">
            <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f381.png" style="width: 80px; height: 80px; margin-bottom: 10px;" alt="Gift">
            <p style="font-size: 13px; color: #666; font-weight: 500;">Win exciting prizes securely with EarnHub.</p>
        </div>
    </div>

    <!-- کسٹم الرٹ ماڈل HTML -->
    <div class="custom-modal" id="customAlertModal">
        <div class="custom-modal-box">
            <div class="custom-modal-text" id="customAlertMessage">Message here</div>
            <button class="custom-modal-btn" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <script>
    /* ==================================================
       CURRENCY CONVERSION LOGIC (GLOBAL SETTING)
    ================================================== */
    const countriesCurrencies = {
        PKR: { symbol: "Rs. ", rate: 1, decimals: 0 },
        USD: { symbol: "$", rate: 0.0036, decimals: 2 },
        INR: { symbol: "₹", rate: 0.30, decimals: 0 },
        EUR: { symbol: "€", rate: 0.0033, decimals: 2 },
        GBP: { symbol: "£", rate: 0.0028, decimals: 2 },
        AED: { symbol: "AED ", rate: 0.013, decimals: 2 },
        SAR: { symbol: "SAR ", rate: 0.013, decimals: 2 }
    };

    function applyGlobalCurrencyToElements() {
        const selectedCurrKey = localStorage.getItem('selectedCurrency') || 'PKR';
        const currObj = countriesCurrencies[selectedCurrKey] || countriesCurrencies['PKR'];
        
        const priceElements = document.querySelectorAll('.currency-price');
        priceElements.forEach(el => {
            const baseVal = parseFloat(el.getAttribute('data-base-usd'));
            if (!isNaN(baseVal)) {
                const convertedVal = baseVal * currObj.rate;
                let formattedNum = convertedVal.toLocaleString('en-US', {
                    minimumFractionDigits: currObj.decimals,
                    maximumFractionDigits: currObj.decimals
                });
                el.innerText = currObj.symbol + formattedNum;
            }
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        applyGlobalCurrencyToElements();
    });
    </script>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBsXMyLONHGs0R7wzAz5MI7ozw0SRBYEvI",
            authDomain: "earnhub-55c59.firebaseapp.com",
            projectId: "earnhub-55c59",
            storageBucket: "earnhub-55c59.firebasestorage.app",
            messagingSenderId: "636270810711",
            appId: "1:636270810711:web:da2bb0625524bcddc27512"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserId = null;
        let userData = null;

        if (localStorage.getItem("tenRupeeGameParticipated") === "true") {
            let btn = document.getElementById("buyBtn1");
            if(btn) {
                btn.disabled = true;
                btn.innerText = "Participated";
            }
        }

        window.showCustomAlert = function(msg) {
            document.getElementById("customAlertMessage").innerText = msg;
            document.getElementById("customAlertModal").style.display = "flex";
        }

        window.closeCustomAlert = function() {
            document.getElementById("customAlertModal").style.display = "none";
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
                localStorage.setItem("currentFirebaseUid", user.uid);
                try {
                    let userRef = doc(db, "users", currentUserId);
                    let userSnap = await getDoc(userRef);
                    if (userSnap.exists()) {
                        userData = userSnap.data();
                        
                        if (userData.oneRupeeGameParticipated === true) {
                            localStorage.setItem("tenRupeeGameParticipated", "true");
                            let btn = document.getElementById("buyBtn1");
                            btn.disabled = true;
                            btn.innerText = "Participated";
                        }
                    }
                } catch (err) {
                    console.error("Error fetching user:", err);
                }
            } else {
                currentUserId = null;
                userData = null;
            }
        });

        window.participateGame = async function(btnId, productName) {
            if (localStorage.getItem("tenRupeeGameParticipated") === "true") {
                let btn = document.getElementById(btnId);
                btn.disabled = true;
                btn.innerText = "Participated";
                return;
            }

            let activeUid = currentUserId || localStorage.getItem("currentFirebaseUid");
            if (!activeUid || !userData) {
                if (auth.currentUser) {
                    activeUid = auth.currentUser.uid;
                } else {
                    showCustomAlert("Pehle login karein!");
                    return;
                }
            }

            let currentBalance = parseFloat(userData?.mainBalance) || 0;
            let ticketPrice = 10;

            if (currentBalance < ticketPrice) {
                showCustomAlert("Aapke pas balance na-kafi hai!");
                return;
            }

            let btn = document.getElementById(btnId);
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                let newBalance = currentBalance - ticketPrice;
                let userRef = doc(db, "users", activeUid);

                await updateDoc(userRef, {
                    mainBalance: newBalance,
                    oneRupeeGameParticipated: true
                });

                userData.mainBalance = newBalance;
                userData.oneRupeeGameParticipated = true;
                localStorage.setItem("tenRupeeGameParticipated", "true");

                showCustomAlert("Successful! Aapke main balance se 10 rupay kaat liye gaye hain.");

                let countSpan = document.getElementById('participantCount');
                let currentCount = parseInt(countSpan.innerText);
                countSpan.innerText = currentCount + 1;

                btn.innerText = "Participated";
                btn.disabled = true;

            } catch (err) {
                console.error("Error:", err);
                showCustomAlert("Kuch masla ho gaya, dobara koshish karein!");
                btn.disabled = false;
                btn.innerText = "Buy for Rs. 10";
            }
        }
    </script>

</body>
</html>
