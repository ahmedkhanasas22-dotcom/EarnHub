<!DOCTYPE html>
<html>
<head>
<title>Withdraw History - EarnHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{ box-sizing:border-box; user-select: none; }
body{
    margin:0; max-width:430px; margin:auto; font-family:Arial, sans-serif; background:#0b0f19; color:white; min-height:100vh; padding-bottom:40px;
}
.header{ text-align:center; padding:15px 10px 5px 10px; }
.unique-logo{
    display:flex; align-items:center; justify-content:center; gap:14px; font-family:Arial,sans-serif; margin: 10px 0;
}
.unique-icon{
    width:60px; height:60px; border-radius:50%; background: linear-gradient(135deg,#00ffff,#0048ff);
    display:flex; align-items:center; justify-content:center; box-shadow: 0 0 20px #00ffff;
}
.eh-symbol{
    width:44px; height:44px; border-radius:50%; background:#050505; display:flex; align-items:center; justify-content:center; color:#ffd700; font-size:16px; font-weight:900; border:2px solid #ffd700;
}
.unique-text h1{ margin:0; font-size:24px; font-weight:900; color:white; text-align: left; }
.unique-text h1 span{ color:#00ffff; }
.unique-text p{ margin:2px 0 0 0; color:#ffd700; font-size:8px; letter-spacing:1.5px; text-align: left; }

.container { padding: 15px; }
.back-btn { display: inline-block; margin-bottom: 15px; color: #00ffff; font-size: 13px; text-decoration: none; font-weight: bold; }
.section-title { font-size: 16px; font-weight: bold; color: #00ffff; margin-bottom: 15px; text-align: center; }

.history-list { display: flex; flex-direction: column; gap: 12px; }
.history-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.history-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.label { color: #8b949e; font-size: 12px; }
.value { color: #fff; font-weight: bold; }
.amount-val { color: #00ff99; font-size: 16px; font-weight: bold; }

/* Status Badges */
.status-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
}
.status-pending { background: rgba(255, 193, 7, 0.15); color: #ffc107; border: 1px solid #ffc107; }
.status-approved { background: rgba(0, 255, 153, 0.15); color: #00ff99; border: 1px solid #00ff99; }
.status-rejected { background: rgba(255, 77, 77, 0.15); color: #ff4d4d; border: 1px solid #ff4d4d; }

.no-history {
    text-align: center;
    color: #8b949e;
    margin-top: 50px;
    font-size: 14px;
}
</style>
</head>
<body>

<div class="header">
<div class="unique-logo">
    <div class="unique-icon">
        <div class="eh-symbol">E↗H</div>
    </div>
    <div class="unique-text">
        <h1>Earn<span>Hub</span></h1>
        <p>SMART MONEY NETWORK</p>
    </div>
</div>
</div>

<div class="container">
    <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
    <div class="section-title">Withdrawal History</div>

    <div class="history-list" id="historyContainer">
        <!-- Dynamic history items will load here -->
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    loadWithdrawHistory();
});

function loadWithdrawHistory() {
    let container = document.getElementById("historyContainer");
    let historyList = JSON.parse(localStorage.getItem("withdrawHistoryList") || "[]");

    if (historyList.length === 0) {
        container.innerHTML = `<div class="no-history">No withdrawal history found!</div>`;
        return;
    }

    let html = "";
    historyList.forEach(item => {
        let statusClass = "status-pending";
        let statusText = item.status || "Pending";
        
        if (statusText.toLowerCase() === "approved") {
            statusClass = "status-approved";
        } else if (statusText.toLowerCase() === "rejected") {
            statusClass = "status-rejected";
        }

        html += `
            <div class="history-card">
                <div class="history-row">
                    <div>
                        <span class="label">Method:</span>
                        <div class="value">${item.method}</div>
                    </div>
                    <div style="text-align: right;">
                        <span class="label">Amount:</span>
                        <div class="amount-val">Rs. ${item.amount}</div>
                    </div>
                </div>
                <div class="history-row">
                    <div>
                        <span class="label">Account Name:</span>
                        <div class="value">${item.name}</div>
                    </div>
                    <div style="text-align: right;">
                        <span class="label">Account No:</span>
                        <div class="value">${item.number}</div>
         .           </div>
                </div>
                <div class="history-row" style="border-top: 1px solid #21262d; padding-top: 8px; margin-top: 4px;">
                    <div>
                        <span class="label">${item.dateTime}</span>
                    </div>
                    <div>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
}
</script>

</body>
</html>
