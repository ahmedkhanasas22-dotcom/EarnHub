<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG UC Daily Rewards - Custom Alert</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; user-select: none; }
body{ font-family:Arial, sans-serif; background: radial-gradient(circle at top,#173b58,#071521 60%,#02080d); color:white; min-height:100vh; padding:10px 6px 30px; }

.header{ max-width:1000px; margin:auto; text-align:center; margin-bottom:10px; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
.header h1{ font-size:16px; color:#ffd900; text-shadow:0 0 8px #ffae00; }
.back-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; text-decoration: none; }

.total-box{ max-width:900px; margin:auto; background:rgba(5,18,28,.9); border:2px solid #e9b400; border-radius:6px; padding:8px; text-align:center; box-shadow:0 0 12px rgba(255,190,0,.2); margin-bottom:12px; }
.total-uc{ font-size:20px; font-weight:bold; color:#ffd400; margin-top:2px; }

/* PUBG UC Submit Form Section */
.submit-section {
    max-width: 900px;
    margin: 0 auto 15px auto;
    background: rgba(16, 37, 55, 0.95);
    border: 1.5px solid #00ffff;
    border-radius: 8px;
    padding: 12px;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
}
.submit-section h3 {
    font-size: 13px;
    color: #00ffff;
    margin-bottom: 8px;
    text-transform: uppercase;
    text-align: center;
    letter-spacing: 0.5px;
}
.form-group {
    margin-bottom: 8px;
}
.form-group label {
    display: block;
    font-size: 10px;
    color: #bbb;
    margin-bottom: 3px;
}
.form-group input {
    width: 100%;
    padding: 7px 10px;
    background: #0b1926;
    border: 1px solid #333;
    border-radius: 5px;
    color: white;
    font-size: 12px;
    outline: none;
}
.form-group input:focus {
    border-color: #00ffff;
}
.submit-btn {
    width: 100%;
    padding: 8px;
    background: linear-gradient(to bottom, #00ffff, #0088cc);
    color: #000;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
    text-transform: uppercase;
    margin-top: 4px;
    box-shadow: 0 2px 8px rgba(0,255,255,0.4);
}
.submit-btn:active { transform: scale(0.98); }

/* Custom Popup Modal Styles */
#customModal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(2px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}
.modal-content {
    background: #0b1926;
    border: 2px solid #00ffff;
    border-radius: 8px;
    width: 85%;
    max-width: 320px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
    animation: zoomIn 0.3s ease;
}
.modal-title {
    font-size: 14px;
    color: #ffd900;
    margin-bottom: 6px;
    font-weight: bold;
    text-transform: uppercase;
}
.modal-message {
    font-size: 11.5px;
    color: #ddd;
    margin-bottom: 12px;
    line-height: 1.4;
}
.modal-btn {
    background: linear-gradient(to bottom, #00ffff, #0088cc);
    color: #000;
    border: none;
    padding: 6px 18px;
    font-size: 10px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
}
@keyframes zoomIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.reward-wrapper {
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
}

.lock-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(7, 21, 33, 0.4);
    backdrop-filter: blur(1.5px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
    z-index: 10;
    text-align: center;
    padding: 20px;
}

.center-lock-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    animation: fadeIn 0.4s ease-in-out;
}

.center-lock-icon {
    font-size: 32px;
    text-shadow: 0 0 12px rgba(255, 170, 0, 0.8);
    margin-bottom: 2px;
}

.center-lock-content h3 {
    font-size: 14px;
    color: #ffaa00;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(255, 170, 0, 0.6);
}

.center-lock-content p {
    font-size: 10.5px;
    color: #ddd;
    text-shadow: 0 1px 3px #000;
    max-width: 280px;
    line-height: 1.4;
}

.center-unlock-btn {
    margin-top: 8px;
    background: linear-gradient(to bottom, #ffaa00, #cc8400);
    color: #000;
    border: none;
    padding: 5px 14px;
    font-size: 9px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

.days{ display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; }

@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,215,0,0.6), inset 0 0 10px rgba(255,215,0,0.4); border-color: #ffd700; }
    50% { transform: scale(1.02); box-shadow: 0 0 18px rgba(255,215,0,1), inset 0 0 15px rgba(255,255,255,0.7); border-color: #fff; }
    100% { transform: scale(1); box-shadow: 0 0 10px rgba(255,215,0,0.6), inset 0 0 10px rgba(255,215,0,0.4); border-color: #ffd700; }
}

.card{ 
    background: linear-gradient(135deg, #7a0b0b 0%, #450303 50%, #200101 100%);
    border: 1.5px solid #d93838;
    border-radius: 6px;
    padding: 6px 5px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6), inset 0 1px 3px rgba(255, 100, 100, 0.4);
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 40%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.12), rgba(255,255,255,0));
    pointer-events: none;
}

.card-available { animation: pulse 1.5s infinite; }
.day{ font-size:9px; font-weight:bold; color:#fff; margin-bottom:3px; text-transform: uppercase; letter-spacing: 0.5px; text-shadow: 0 1px 2px #000; }

.uc-img-container {
    width: 100%;
    height: 42px; 
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 2px 0;
}
.uc-img { max-height: 100%; object-fit: contain; }

.reward-amount { 
    font-size: 8.5px; 
    color: #ffda44; 
    font-weight: bold; 
    text-align: right; 
    padding-right: 3px;
    margin-bottom: 3px;
}

button.claim-btn{ 
    width:100%; padding:4px; border-radius:3px; font-weight:bold; cursor:pointer; 
    background: linear-gradient(to bottom, #114b5f, #082530); color: #fff; border: 1px solid #20a9bd; font-size: 8.5px; text-transform: uppercase;
}
button.claim-btn:disabled{ background: linear-gradient(to bottom, #222, #111); border-color: #444; color: #777; }
.claimed button.claim-btn { border-color: #16824f; color: #4ade80; background: linear-gradient(to bottom, #0d2b1f, #06150e); }
.missed button.claim-btn { border-color: #a94442; color: #ff6b6b; background: linear-gradient(to bottom, #3a1111, #1a0505); }
</style>
</head>

<body>

<!-- Custom Alert Modal Box -->
<div id="customModal">
    <div class="modal-content">
        <div class="modal-title" id="modalTitle">EarnHub Notice</div>
        <div class="modal-message" id="modalMessage">यहाँ मेसेज شو ہوگا</div>
        <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
</div>

<div class="header">
    <a href="dashboard.html" class="back-btn">⬅ Dashboard</a>
    <h1>🎮 PUBG UC REWARDS</h1>
    <div style="width: 55px;"></div>
</div>

<div class="total-box">
    <div style="font-size:8px; color:#aaa;">TOTAL UC COLLECTED</div>
    <div class="total-uc"><span id="totalUC">0</span> UC</div>
</div>

<!-- PUBG UC Submit Form Section -->
<div class="submit-section">
    <h3>📥 PUBG UC Submit / Withdraw</h3>
    <div class="form-group">
        <label>PUBG Username</label>
        <input type="text" id="pubgUsername" placeholder="Apna PUBG Name likhein">
    </div>
    <div class="form-group">
        <label>PUBG User ID</label>
        <input type="text" id="pubgUserId" placeholder="Apni PUBG ID likhein">
    </div>
    <div class="form-group">
        <label>UC Amount (Min. 300 - Max. 50,000 UC)</label>
        <input type="number" id="pubgUcAmount" placeholder="Min 300 aur Max 50,000 UC likhein">
    </div>
    <button class="submit-btn" onclick="submitUcRequest()">Submit UC Request</button>
</div>

<div class="reward-wrapper">
    <div id="lockOverlay" class="lock-overlay">
        <div class="center-lock-content">
            <div class="center-lock-icon">🔒</div>
            <h3 id="lockTitle">UC REWARDS LOCKED</h3>
            <p id="lockDesc">نیا پیکج بائے کریں تاکہ یہ انلاک ہو جائیں!</p>
            <button class="center-unlock-btn" onclick="onUserBuyPackage()">Buy Package</button>
        </div>
    </div>

    <div class="days" id="daysContainer"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBsXMyLONHGs0R7wzAz5MI7ozw0SRBYEvI",
    authDomain: "earnhub-55c59.firebaseapp.com",
    projectId: "earnhub-55c59",
    storageBucket: "earnhub-55c59.firebasestorage.app",
    messagingSenderId: "636270810711",
    appId: "1:636270810711:web:da2bb0625524bcddc27512"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const TOTAL_DAYS = 30;
const UC_PER_DAY = 10;

let firebaseUserData = {
    hasPubgPackage: false,
    packageStartDate: null,
    claimed: [],
    missed: [],
    totalUC: 0,
    isCompleted: false
};

// کسٹم الرٹ شو کرنے کا فنکشن
window.showCustomAlert = function(title, message) {
    document.getElementById("modalTitle").innerText = title;
    document.getElementById("modalMessage").innerText = message;
    document.getElementById("customModal").style.display = "flex";
}

window.closeModal = function() {
    document.getElementById("customModal").style.display = "none";
}

function getTodayString() {
    const now = new Date();
    return now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate();
}

onAuthStateChanged(auth, async (user) => {
    if (user) {
        try {
            let userDocRef = doc(db, "users", user.uid);
            let userDocSnap = await getDoc(userDocRef);
            if (userDocSnap.exists()) {
                let data = userDocSnap.data();
                
                firebaseUserData.hasPubgPackage = data.hasPubgPackage || false;
                firebaseUserData.packageStartDate = data.pubgStartDate || getTodayString();
                firebaseUserData.claimed = data.pubgClaimed || [];
                firebaseUserData.missed = data.pubgMissed || [];
                firebaseUserData.totalUC = data.pubgTotalUC || 0;
                firebaseUserData.isCompleted = data.pubgIsCompleted || false;

                renderUI();
            }
        } catch(e) {
            console.error("Error loading user data:", e);
        }
    } else {
        window.location.href = "login.html";
    }
});

function renderUI() {
    const overlay = document.getElementById("lockOverlay");
    const lockTitle = document.getElementById("lockTitle");
    const lockDesc = document.getElementById("lockDesc");
    const container = document.getElementById("daysContainer");
    container.innerHTML = "";

    if (!firebaseUserData.hasPubgPackage) {
        overlay.style.display = "flex";
        if (firebaseUserData.isCompleted) {
            lockTitle.innerText = "30 DAYS COMPLETED!";
            lockDesc.innerText = "تمام یو سی کلیم ہو چکے ہیں، نیا پیکج لیں۔";
        } else {
            lockTitle.innerText = "UC REWARDS LOCKED";
            lockDesc.innerText = "پہلے انویسٹمنٹ پلان بائے کریں تاکہ یہ انلاک ہو جائیں!";
        }
    } else {
        overlay.style.display = "none";
    }

    let activeDayIndex = 1;
    if (firebaseUserData.hasPubgPackage && firebaseUserData.packageStartDate) {
        const todayStr = getTodayString();
        const start = new Date(firebaseUserData.packageStartDate);
        const current = new Date(todayStr);
        activeDayIndex = Math.floor((current - start) / (1000 * 60 * 60 * 24)) + 1;
    }

    for(let i = 1; i <= TOTAL_DAYS; i++){
        const claimed = firebaseUserData.claimed.includes(i);
        const missed = firebaseUserData.missed.includes(i) || (firebaseUserData.hasPubgPackage && i < activeDayIndex && !claimed);
        const isToday = firebaseUserData.hasPubgPackage && (i === activeDayIndex);

        const card = document.createElement("div");
        let cardClasses = "card";
        if (claimed) cardClasses += " claimed";
        else if (missed) cardClasses += " missed";
        else if (isToday) cardClasses += " card-available";
        card.className = cardClasses;

        let btnText = "Locked";
        if (claimed) btnText = "✓ Collected";
        else if (missed) btnText = "✗ Missed";
        else if (isToday) btnText = "Collect";

        card.innerHTML = `
            <div class="day">Day ${i}</div>
            <div class="uc-img-container">
                <img src="images/uc-logo.jpeg" class="uc-img" onerror="this.src='https://i.ibb.co/3s6K8Tf/uc-icon.png'">
            </div>
            <div class="reward-amount">${UC_PER_DAY} UC</div>
            <button class="claim-btn" onclick="claimRewardDay(${i})" ${(!isToday || claimed || missed) ? "disabled" : ""}>${btnText}</button>
        `;
        container.appendChild(card);
    }

    document.getElementById("totalUC").innerText = firebaseUserData.totalUC;
}

// جب یوزر بائے پیکج پر کلک کرے گا تو فائر بیس چیک کرے گا
window.onUserBuyPackage = async function() {
    let user = auth.currentUser;
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    let userDocRef = doc(db, "users", user.uid);
    let userDocSnap = await getDoc(userDocRef);

    if (userDocSnap.exists()) {
        let data = userDocSnap.data();
        if (data.hasPubgPackage === true) {
            firebaseUserData.hasPubgPackage = true;
            renderUI();
        } else {
            // اگر پیکج نہیں خریدا تو پلان والے پیج پر بھیج دے گا
            window.location.href = "plans.html";
        }
    } else {
        window.location.href = "plans.html";
    }
}

window.claimRewardDay = async function(day) {
    let user = auth.currentUser;
    if (!user || !firebaseUserData.hasPubgPackage) return;

    const todayStr = getTodayString();
    const start = new Date(firebaseUserData.packageStartDate);
    const current = new Date(todayStr);
    const activeDayIndex = Math.floor((current - start) / (1000 * 60 * 60 * 24)) + 1;

    if(day === activeDayIndex && !firebaseUserData.claimed.includes(day)){
        firebaseUserData.claimed.push(day);
        firebaseUserData.totalUC += UC_PER_DAY;

        if(firebaseUserData.claimed.length >= TOTAL_DAYS) {
            firebaseUserData.isCompleted = true;
            firebaseUserData.hasPubgPackage = false;
        }

        let userDocRef = doc(db, "users", user.uid);
        await updateDoc(userDocRef, {
            pubgClaimed: firebaseUserData.claimed,
            pubgTotalUC: firebaseUserData.totalUC,
            pubgIsCompleted: firebaseUserData.isCompleted,
            hasPubgPackage: firebaseUserData.hasPubgPackage
        });

        renderUI();
    }
}

window.submitUcRequest = async function() {
    let user = auth.currentUser;
    if (!user) return;

    let name = document.getElementById("pubgUsername").value.trim();
    let pubgId = document.getElementById("pubgUserId").value.trim();
    let amount = Number(document.getElementById("pubgUcAmount").value);

    if (name === "" || pubgId === "") {
        showCustomAlert("Error", "برائے مہربانی اپنا پب جی یوزر نیم اور یوزر آئی ڈی درج کریں!");
        return;
    }

    if (amount < 300) {
        showCustomAlert("Invalid Amount", "کم از کم 300 UC ہونا لازمی ہے!");
        return;
    }

    if (amount > 50000) {
        showCustomAlert("Invalid Amount", "زیادہ سے زیادہ 50,000 UC ہی سبمٹ کی جا سکتی ہیں!");
        return;
    }

    if (firebaseUserData.totalUC < amount) {
        showCustomAlert("Low Balance", "آپ کے پاس اتنے UC موجود نہیں ہیں جتنا آپ نے درج کیا ہے! آپ کا کل بیلنس: " + firebaseUserData.totalUC + " UC ہے.");
        return;
    }

    firebaseUserData.totalUC -= amount;

    let userDocRef = doc(db, "users", user.uid);
    await updateDoc(userDocRef, {
        pubgTotalUC: firebaseUserData.totalUC
    });

    showCustomAlert("Success", "مبارک ہو! آپ کی " + amount + " UC کی ریکوئسٹ کامیابی سے سبمٹ ہو گئی ہے۔");
    
    document.getElementById("pubgUsername").value = "";
    document.getElementById("pubgUserId").value = "";
    document.getElementById("pubgUcAmount").value = "";
    
    renderUI();
}
</script>
</body>
</html>
