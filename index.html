<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnHub - سائن اپ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .signup-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .login-link a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>EarnHub اکاؤنٹ بنائیں</h2>
        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label for="fullname">پورا نام</label>
                <input type="text" id="fullname" required placeholder="اپنا نام درج کریں">
            </div>
            <div class="form-group">
                <label for="email">ای میل ایڈریس</label>
                <input type="email" id="email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label for="phone">فون نمبر (موبائل)</label>
                <input type="text" id="phone" required placeholder="03XXXXXXXXX">
            </div>
            <div class="form-group">
                <label for="password">پاسورڈ</label>
                <input type="password" id="password" required placeholder="پاسورڈ درج کریں">
            </div>
            <div class="form-group">
                <label for="refCode">ریفرل کوڈ (اختیاری)</label>
                <input type="text" id="refCode" placeholder="اگر ہے تو درج کریں">
            </div>
            <button type="submit">سائن اپ کریں</button>
        </form>
        <div class="login-link">
            پہلے سے اکاؤنٹ موجود ہے؟ <a href="login.html">لاگ ان کریں</a>
        </div>
    </div>

    <script>
        function handleSignup(event) {
            event.preventDefault();

            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const refCode = document.getElementById('refCode').value;

            // یونیک یوزر آئی ڈی (UUID) جنریٹ کرنا
            const userId = 'EH-' + Math.floor(100000 + Math.random() * 900000);

            // نیا یوزر ابجیکٹ (بنیادی بیلنس بالکل زیرو رکھا گیا ہے)
            const newUser = {
                userId: userId,
                fullname: fullname,
                email: email,
                phone: phone,
                password: password,
                balance: 0,          // زیرو بیلنس شرط کے مطابق
                totalDeposit: 0,
                totalWithdraw: 0,
                activePlan: null,
                referredBy: refCode || 'None',
                createdAt: new Date().toISOString()
            };

            // لوکل اسٹوریج یا ڈیٹا بیس میں محفوظ کرنا
            let users = JSON.parse(localStorage.getItem('earnhub_users')) || [];
            
            // چیک کریں کہ ای میل پہلے سے موجود تو نہیں
            const existingUser = users.find(u => u.email === email);
            if (existingUser) {
                alert('یہ ای میل پہلے سے رجسٹرڈ ہے!');
                return;
            }

            users.push(newUser);
            localStorage.setItem('earnhub_users', JSON.stringify(users));
            
            // کرنٹ سیشن سیٹ کرنا
            localStorage.setItem('current_user', JSON.stringify(newUser));

            alert('اکاؤنٹ کامیابی سے بن گیا ہے! اب آپ کو ڈیش بورڈ پر ری ڈائریکٹ کیا جا رہا ہے۔');
            window.location.href = 'dashboard.html';
        }
    </script>

</body>
</html>
