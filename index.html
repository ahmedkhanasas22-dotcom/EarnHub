<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnHub - Sign Up</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <h2 class="text-3xl font-bold text-center text-emerald-400 mb-6">EarnHub Sign Up</h2>
        
        <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Full Name</label>
                <input type="text" id="name" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-400" placeholder="Enter your name">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-400" placeholder="Enter your email">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-400" placeholder="Create a password">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Referral Code (Optional)</label>
                <input type="text" id="refCode" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none text-slate-400" placeholder="Referral code" readonly>
            </div>

            <button type="submit" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 font-semibold rounded-lg transition duration-200 shadow-lg">Register Account</button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-4">
            Already have an account? <a href="login.html" class="text-emerald-400 hover:underline">Login</a>
        </p>
    </div>

    <script>
        // URL سے ریفرل کوڈ گیٹ کرنا اور فیلڈ کو لاک (Read-only) کرنا
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            if (ref) {
                const refInput = document.getElementById('refCode');
                refInput.value = ref;
                refInput.setAttribute('readonly', true);
            }
        };

        function handleSignup(event) {
            event.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const refCode = document.getElementById('refCode').value;

            // یونیک یوزر آئی ڈی بنانا
            const userId = 'EH-' + Math.floor(100000 + Math.random() * 900000);

            // یوزر ڈیٹا অবজেক্ট (مین بیلنس بالکل 0 ہوگا)
            const userData = {
                userId: userId,
                name: name,
                email: email,
                password: password,
                balance: 0,
                upline: refCode || 'None'
            };

            // لوکل اسسٹوری میں یوزر سیવ کرنا
            let users = JSON.parse(localStorage.getItem('earnHubUsers')) || [];
            users.push(userData);
            localStorage.setItem('earnHubUsers', JSON.stringify(users));

            // اگر ریفرل کوڈ موجود ہے تو اپ لائن (Upline) یوزر کو Rs. 50 کمیشن دینا
            if (refCode) {
                let allUsers = JSON.parse(localStorage.getItem('earnHubUsers')) || [];
                let uplineUser = allUsers.find(u => u.userId === refCode);
                if (uplineUser) {
                    uplineUser.balance += 50; // 50 روپے کمیشن ایڈ
                    localStorage.setItem('earnHubUsers', JSON.stringify(allUsers));
                }
            }

            alert('Account created successfully! Your User ID is: ' + userId);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
