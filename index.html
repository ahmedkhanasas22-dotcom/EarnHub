<!DOCTYPE html>
<html>
<head>
<title>EarnHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{ box-sizing:border-box; user-select: none; }
body{
margin:0;
max-width:430px;
margin:auto;
font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background:#0b0f19;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
position: relative;
overflow-x: hidden;
}

.box{
width:350px;
background:#161b22;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,0.3);
border: 1px solid rgba(255,255,255,0.1);
}

/* یونیک لوگو ڈیزائن */
.unique-logo{
    display:flex; 
    align-items:center; 
    justify-content:center; 
    gap:14px; 
    font-family:Arial,sans-serif; 
    margin-bottom: 25px;
}
.unique-icon{
    width:50px; 
    height:50px; 
    border-radius:50%; 
    background: linear-gradient(135deg,#00ffff,#0048ff);
    display:flex; 
    align-items:center; 
    justify-content:center; 
    box-shadow: 0 0 15px #00ffff;
}
.eh-symbol{
    width:36px; 
    height:36px; 
    border-radius:50%; 
    background:#050505; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    color:#ffd700; 
    font-size:14px; 
    font-weight:900; 
    border:2px solid #ffd700;
}
.unique-text h1{ 
    margin:0; 
    font-size:22px; 
    font-weight:900; 
    color:white; 
    text-align: left; 
}
.unique-text h1 span{ 
    color:#00ffff; 
}
.unique-text p{ 
    margin:2px 0 0 0; 
    color:#ffd700; 
    font-size:7px; 
    letter-spacing:1.5px; 
    text-align: left; 
}

h2{
color:white;
}

input{
width:90%;
padding:13px;
margin:8px;
border-radius:10px;
border:1px solid #30363d;
outline: none;
background: #0b0f19;
color: white;
font-size: 14px;
}

button{
width:90%;
padding:13px;
margin:10px 0;
border:none;
border-radius:25px;
background:cyan;
font-weight:bold;
cursor: pointer;
color: #000;
font-size: 14px;
}

button:disabled {
background: #555 !important;
cursor: not-allowed;
}

a{
color:cyan;
cursor:pointer;
text-decoration: underline;
font-size: 13px;
}

p{
color:#8b949e;
font-size: 13px;
margin: 8px 0;
}

#loginBox{
display:none;
}
</style>

</head>

<body>

<div class="box">

<!-- یونیک لوگو سیکشن -->
<div class="unique-logo">
    <div class="unique-icon">
        <div class="eh-symbol">E↗H</div>
    </div>
    <div class="unique-text">
        <h1>Earn<span>Hub</span></h1>
        <p>SMART MONEY NETWORK</p>
    </div>
</div>

<!-- سائن اپ باکس -->
<div id="signupBox">

<h2>Sign Up</h2>

<input id="suser" placeholder="Username">
<input id="semail" type="email" placeholder="Email">
<input id="spass" type="password" placeholder="Password">
<input id="sref" placeholder="Referral Code (Optional)" readonly style="background: #111; color: #aaa; cursor: not-allowed;">

<button id="signupBtn" onclick="signup()">Create Account</button>

<p>Already have account?</p>
<a onclick="showLogin()">Login</a>

</div>

<!-- لاگ ان باکس -->
<div id="loginBox">

<h2>Login</h2>

<input id="lemail" type="email" placeholder="Email">
<input id="lpass" type="password" placeholder="Password">

<button id="loginBtn" onclick="login()">Login</button>

<p>
<a onclick="forgotPassword()">Forgot Password?</a>
</p>

<p>New user?</p>
<a onclick="showSignup()">Sign Up</a>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBsXMyLONHGs0R7wzAz5MI7ozw0SRBYEvI",
    authDomain: "earnhub-55c59.firebaseapp.com",
    projectId: "earnhub-55c59",
    storageBucket: "earnhub-55c59.firebasestorage.app",
    messagingSenderId: "636270810711",
    appId: "1:636270810711:web:da2bb0625524bcddc27512"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let urlParams = new URLSearchParams(window.location.search);
let refUser = urlParams.get("ref");
if(refUser) {
    let refInput = document.getElementById("sref");
    refInput.value = refUser;
    refInput.setAttribute("readonly", true);
}

window.signup = async function() {
    let user = document.getElementById("suser").value.trim();
    let email = document.getElementById("semail").value.trim();
    let pass = document.getElementById("spass").value.trim();
    let ref = document.getElementById("sref").value.trim(); 
    let btn = document.getElementById("signupBtn");

    if(user === "" || email === "" || pass === ""){
        alert("Please fill all required fields!");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Creating...";

    try {
        localStorage.clear();

        let userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        let firebaseUser = userCredential.user;

        let myCode = "EH" + Math.floor(1000 + Math.random() * 9000);
        let userIdVal = "#" + Math.floor(10000 + Math.random() * 90000);

        await setDoc(doc(db, "users", firebaseUser.uid), {
            username: user,
            email: email,
            password: pass,
            myReferralCode: myCode,
            referral: ref,
            mainBalance: 0,
            totalReferrals: 0,
            packageActive: false,
            userId: userIdVal,
            role: "user"
        });

        if(ref) {
            let q = query(collection(db, "users"), where("myReferralCode", "==", ref));
            let querySnapshot = await getDocs(q);
            if(!querySnapshot.empty) {
                querySnapshot.forEach(async (uDoc) => {
                    let uplineData = uDoc.data();
                    let uplineRef = doc(db, "users", uDoc.id);
                    
                    let currentBalance = Number(uplineData.mainBalance || 0);
                    let currentReferrals = Number(uplineData.totalReferrals || 0);

                    await updateDoc(uplineRef, {
                        totalReferrals: currentReferrals + 1,
                        mainBalance: currentBalance + 50
                    });
                });
            }
        }

        alert("Account Created Successfully! Please Login.");
        showLogin();
    } catch (error) {
        if (error.code === 'auth/email-already-in-use') {
            alert("This email is already registered! Please login.");
            showLogin();
        } else if (error.code === 'auth/invalid-email') {
            alert("Please enter a valid email address!");
        } else if (error.code === 'auth/weak-password') {
            alert("Password should be at least 6 characters!");
        } else {
            alert("Error: " + error.message);
        }
    } finally {
        btn.disabled = false;
        btn.innerText = "Create Account";
    }
}

window.login = async function() {
    let email = document.getElementById("lemail").value.trim();
    let pass = document.getElementById("lpass").value.trim();
    let btn = document.getElementById("loginBtn");

    if(email === "" || pass === ""){
        alert("Please enter email and password!");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Logging in...";

    try {
        let userCredential = await signInWithEmailAndPassword(auth, email, pass);
        let firebaseUser = userCredential.user;

        let userDocRef = doc(db, "users", firebaseUser.uid);
        let userDoc = await getDoc(userDocRef);

        let userName = email.split('@')[0];
        let myCode = "EH" + Math.floor(1000 + Math.random() * 9000);
        let userIdVal = "#" + Math.floor(10000 + Math.random() * 90000);
        let userBalance = 0;

        if (!userDoc.exists()) {
            await setDoc(userDocRef, {
                username: userName,
                email: email,
                password: pass,
                myReferralCode: myCode,
                referral: "",
                mainBalance: 0,
                totalReferrals: 0,
                packageActive: false,
                userId: userIdVal,
                role: "user"
            });
        } else {
            let data = userDoc.data();
            userName = data.username || userName;
            myCode = data.myReferralCode || myCode;
            userIdVal = data.userId || userIdVal;
            userBalance = Number(data.mainBalance || 0);
        }

        localStorage.setItem("userName", userName);
        localStorage.setItem("user", userName);
        localStorage.setItem("myReferralCode", myCode);
        localStorage.setItem("email", email);
        localStorage.setItem("userId", userIdVal);
        localStorage.setItem("mainBalance", userBalance);

        window.location.href = "dashboard.html";
    } catch (error) {
        alert("Wrong Email or Password!");
    } finally {
        btn.disabled = false;
        btn.innerText = "Login";
    }
}

window.forgotPassword = async function() {
    let email = prompt("Enter your registered email:");
    if(!email) return;

    try {
        let q = query(collection(db, "users"), where("email", "==", email.trim()));
        let querySnapshot = await getDocs(q);

        if(querySnapshot.empty){
            alert("Account exists in Auth but database record is missing. Please try logging in with your password, or sign up with a new email.");
        } else {
            querySnapshot.forEach((docSnap) => {
                let data = docSnap.data();
                alert("Account Details Found!\n\nUsername: " + data.username + "\nPassword: " + data.password);
            });
        }
    } catch (error) {
        alert("Error: " + error.message);
    }
}

window.showLogin = function(){
    document.getElementById("signupBox").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
}

window.showSignup = function(){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("signupBox").style.display = "block";
}
</script>

</body>
</html>
