<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnHub - Sign Up</title>
    <!-- Add your original styling links or Tailwind/CSS here -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <!-- Keep your original design and logo structure here -->
    <div class="signup-container">
        <!-- Example Logo Placement -->
        <div class="logo-area text-center mb-4">
            <h1 class="text-3xl font-bold text-emerald-400">EarnHub</h1>
        </div>

        <form id="signupForm" onsubmit="handleSignup(event)">
            <div>
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>

            <div>
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>

            <div>
                <label>Password</label>
                <input type="password" id="password" required placeholder="Create a password">
            </div>

            <div>
                <label>Referral Code (Optional)</label>
                <input type="text" id="refCode" placeholder="Referral code" readonly>
            </div>

            <button type="submit">Register Account</button>
        </form>
    </div>

    <script>
        // Automatic referral code detection from URL and making it read-only
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            if (ref) {
                const refInput = document.getElementById('refCode');
                refInput.value = ref;
                refInput.setAttribute('readonly', true);
            }
        };

        function handleSignup(event) {
            event.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const refCode = document.getElementById('refCode').value;

            // Generate unique user ID
            const userId = 'EH-' + Math.floor(100000 + Math.random() * 900000);

            // User data object with initial balance set to 0
            const userData = {
                userId: userId,
                name: name,
                email: email,
                password: password,
                balance: 0,
                upline: refCode || 'None'
            };

            // Save user to local storage
            let users = JSON.parse(localStorage.getItem('earnHubUsers')) || [];
            users.push(userData);
            localStorage.setItem('earnHubUsers', JSON.stringify(users));

            // If a referral code exists, give Rs. 50 commission to the upline user
            if (refCode) {
                let allUsers = JSON.parse(localStorage.getItem('earnHubUsers')) || [];
                let uplineUser = allUsers.find(u => u.userId === refCode);
                if (uplineUser) {
                    uplineUser.balance += 50; // Add Rs. 50 commission
                    localStorage.setItem('earnHubUsers', JSON.stringify(allUsers));
                }
            }

            alert('Account created successfully! Your User ID is: ' + userId);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
