<!DOCTYPE html>
<html>
<head>
<title>EarnHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- FontAwesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{ box-sizing:border-box; user-select: none; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body{
    margin:0;
    max-width:430px;
    margin:auto;
    background:#e4ebf5;
    color:#333;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position: relative;
    overflow: hidden;
    perspective: 1000px;
}

/* 3D Flip Card Wrapper */
.card-wrapper{
    width: 380px;
    height: 580px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
}

.card-wrapper.rotate {
    transform: rotateY(180deg);
}

/* Main Box (Card Faces) */
.box{
    width: 100%;
    height: 100%;
    background:#e4ebf5;
    padding: 30px 25px;
    border-radius: 30px;
    text-align:center;
    box-shadow: 13px 13px 20px #cbced1, -13px -13px 20px #ffffff;
    border: none;
    position: absolute;
    top: 0;
    left: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Card Layers Fix */
#loginBox {
    transform: rotateY(180deg);
    z-index: 1;
    pointer-events: none;
    display: flex !important; /* Original display none ko override karne ke liye */
}

#signupBox {
    z-index: 2;
    pointer-events: auto;
    display: flex !important;
}

.card-wrapper.rotate #signupBox {
    z-index: 1;
    pointer-events: none;
}

.card-wrapper.rotate #loginBox {
    z-index: 2;
    pointer-events: auto;
}

/* یونیک لوگو ڈیزائن */
.unique-logo{
    display:flex; 
    align-items:center; 
    justify-content:center; 
    gap:12px; 
    margin-bottom: 20px;
    width: 100%;
}
.unique-icon{
    width:45px; 
    height:45px; 
    border-radius:50%; 
    background: #e4ebf5;
    display:flex; 
    align-items:center; 
    justify-content:center; 
    box-shadow: inset 4px 4px 6px #cbced1, inset -4px -4px 6px #ffffff;
}
.eh-symbol{
    width:32px; 
    height:32px; 
    border-radius:50%; 
    background:#0b0f19; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    color:#00ffff; 
    font-size:12px; 
    font-weight:900; 
    border:2px solid #00ffff;
}
.unique-text h1{ 
    margin:0; 
    font-size:20px; 
    font-weight:900; 
    color:#333; 
    text-align: left; 
}
.unique-text h1 span{ 
    color:#0056b3; 
}
.unique-text p{ 
    margin:2px 0 0 0; 
    color:#777; 
    font-size:7px; 
    letter-spacing:1.5px; 
    text-align: left; 
}

h2{
    color:#333;
    font-size: 20px;
    margin-bottom: 5px;
}

/* Input Container with Sliding Blue Line Animation */
.input-container {
    width: 100%;
    margin-bottom: 12px;
    position: relative;
    border-radius: 30px;
    overflow: hidden;
}

.input-container::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #0056b3, #00a8ff);
    z-index: 10;
}

.input-container:focus-within::after {
    animation: slideLine 1.5s linear infinite;
}

@keyframes slideLine {
    0% { left: -100%; }
    100% { left: 100%; }
}

input{
    width:100%;
    padding:12px 18px;
    margin:0;
    border-radius:30px;
    border:none;
    outline: none;
    background: #e4ebf5;
    color: #333;
    font-size: 13px;
    box-shadow: inset 3px 3px 6px #cbced1, inset -3px -3px 6px #ffffff;
    position: relative;
    z-index: 2;
}

input::placeholder {
    color: #888;
}

button{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:30px;
    background:#e4ebf5;
    font-weight:bold;
    cursor: pointer;
    color: #0056b3;
    font-size: 13px;
    box-shadow: 5px 5px 10px #cbced1, -5px -5px 10px #ffffff;
    transition: all 0.2s ease;
    letter-spacing: 1px;
}

button:active {
    box-shadow: inset 3px 3px 5px #cbced1, inset -3px -3px 5px #ffffff;
}

button:disabled {
    background: #e4ebf5 !important;
    color: #aaa !important;
    cursor: not-allowed;
    box-shadow: inset 2px 2px 4px #cbced1, inset -2px -2px 4px #ffffff !important;
}

a{
    color:#0056b3;
    cursor:pointer;
    text-decoration: none;
    font-size: 12px;
    font-weight: bold;
}

a:hover {
    text-decoration: underline;
}

p{
    color:#666;
    font-size: 12px;
    margin: 8px 0;
}

/* کسٹم پاپ اپ ماڈل ڈیزائن */
.custom-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    padding: 15px;
}
.custom-modal-box {
    background: #e4ebf5;
    width: 100%;
    max-width: 320px;
    border-radius: 20px;
    border: none;
    padding: 25px;
    text-align: center;
    box-shadow: 10px 10px 20px #cbced1, -10px -10px 20px #ffffff;
}
.custom-modal-text {
    color: #333;
    font-size: 14px;
    margin-bottom: 20px;
    line-height: 1.4;
    white-space: pre-line;
}
.custom-modal-btn {
    background: #e4ebf5;
    color: #0056b3;
    border: none;
    padding: 10px 25px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    width: auto;
    margin-top: 0;
    box-shadow: 4px 4px 8px #cbced1, -4px -4px 8px #ffffff;
}
.custom-modal-input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 20px;
    border: none;
    background: #e4ebf5;
    color: #333;
    font-size: 13px;
    outline: none;
    box-shadow: inset 3px 3px 6px #cbced1, inset -3px -3px 6px #ffffff;
}
.modal-btn-group {
    display: flex;
    gap: 10px;
    justify-content: center;
}
.custom-modal-cancel {
    background: #e4ebf5;
    color: #555;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    width: auto;
    margin-top: 0;
    box-shadow: 4px 4px 8px #cbced1, -4px -4px 8px #ffffff;
}
</style>

</head>

<body>

<div class="card-wrapper" id="cardWrapper">

    <!-- سائن اپ باکس (Front Side) -->
    <div class="box" id="signupBox">

        <!-- یونیک لوگو سیکشن -->
        <div class="unique-logo">
            <div class="unique-icon">
                <div class="eh-symbol">E↗H</div>
            </div>
            <div class="unique-text">
                <h1>Earn<span>Hub</span></h1>
                <p>SMART MONEY NETWORK</p>
            </div>
        </div>

        <h2>Sign Up</h2>

        <div class="input-container"><input id="suser" placeholder="Username"></div>
        <div class="input-container"><input id="semail" type="email" placeholder="Email"></div>
        <div class="input-container"><input id="spass" type="password" placeholder="Password"></div>
        <div class="input-container"><input id="sref" placeholder="Referral UID (Optional)" readonly style="background: #d8e1ef; color: #777; cursor: not-allowed;"></div>

        <button id="signupBtn" onclick="signup()">Create Account</button>

        <p>Already have account? <a onclick="showLogin()">Login</a></p>

    </div>

    <!-- لاگ ان باکس (Back Side) -->
    <div class="box" id="loginBox">

        <!-- یونیک لوگو سیکشن -->
        <div class="unique-logo">
            <div class="unique-icon">
                <div class="eh-symbol">E↗H</div>
            </div>
            <div class="unique-text">
                <h1>Earn<span>Hub</span></h1>
                <p>SMART MONEY NETWORK</p>
            </div>
        </div>

        <h2>Login</h2>

        <div class="input-container" style="margin-top: 15px;"><input id="lemail" type="email" placeholder="Email"></div>
        <div class="input-container"><input id="lpass" type="password" placeholder="Password"></div>

        <button id="loginBtn" onclick="login()" style="margin-top: 20px;">Login</button>

        <p style="margin-top: 15px;"><a onclick="forgotPassword()">Forgot Password?</a></p>

        <p>New user? <a onclick="showSignup()">Sign Up</a></p>

    </div>

</div>

<!-- کسٹم الرٹ ماڈل HTML -->
<div class="custom-modal" id="customAlertModal">
    <div class="custom-modal-box">
        <div class="custom-modal-text" id="customAlertMessage">Alert Message Here</div>
        <button class="custom-modal-btn" onclick="closeCustomAlert()">OK</button>
    </div>
</div>

<!-- کسٹم پرامپٹ ماڈل HTML (فارگیٹ پاسورڈ کے لیے) -->
<div class="custom-modal" id="customPromptModal">
    <div class="custom-modal-box">
        <div class="custom-modal-text">Enter your registered email:</div>
        <input type="email" id="customPromptInput" class="custom-modal-input" placeholder="example@email.com">
        <div class="modal-btn-group">
            <button class="custom-modal-cancel" onclick="closeCustomPrompt(false)">Cancel</button>
            <button class="custom-modal-btn" onclick="closeCustomPrompt(true)">Submit</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBsXMyLONHGs0R7wzAz5MI7ozw0SRBYEvI",
    authDomain: "earnhub-55c59.firebaseapp.com",
    projectId: "earnhub-55c59",
    storageBucket: "earnhub-55c59.firebasestorage.app",
    messagingSenderId: "636270810711",
    appId: "1:636270810711:web:da2bb0625524bcddc27512"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let pendingRedirectUrl = null;
let promptCallback = null;

// کسٹم الرٹ فنکشن
window.showCustomAlert = function(msg, redirectTo = null) {
    document.getElementById("customAlertMessage").innerText = msg;
    pendingRedirectUrl = redirectTo;
    document.getElementById("customAlertModal").style.display = "flex";
}

window.closeCustomAlert = function() {
    document.getElementById("customAlertModal").style.display = "none";
    if (pendingRedirectUrl) {
        if (pendingRedirectUrl === "login") {
            showLogin();
        } else {
            window.location.href = pendingRedirectUrl;
        }
        pendingRedirectUrl = null;
    }
}

// کسٹم پرامپٹ فنکشن
window.showCustomPrompt = function(callback) {
    promptCallback = callback;
    document.getElementById("customPromptInput").value = "";
    document.getElementById("customPromptModal").style.display = "flex";
}

window.closeCustomPrompt = function(isSubmitted) {
    document.getElementById("customPromptModal").style.display = "none";
    let val = document.getElementById("customPromptInput").value;
    if (promptCallback) {
        let cb = promptCallback;
        promptCallback = null;
        cb(isSubmitted ? val : null);
    }
}

// URL سے فائر بیس UID والا ریفرل پکڑنا
let urlParams = new URLSearchParams(window.location.search);
let refUserUid = urlParams.get("ref");
if(refUserUid) {
    let refInput = document.getElementById("sref");
    refInput.value = refUserUid;
    refInput.setAttribute("readonly", true);
}

window.signup = async function() {
    let user = document.getElementById("suser").value.trim();
    let email = document.getElementById("semail").value.trim();
    let pass = document.getElementById("spass").value.trim();
    let refUid = document.getElementById("sref").value.trim(); 
    let btn = document.getElementById("signupBtn");

    if(user === "" || email === "" || pass === ""){
        showCustomAlert("Please fill all required fields!");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Creating...";

    try {
        let userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        let firebaseUser = userCredential.user;

        let myCode = "EH" + Math.floor(1000 + Math.random() * 9000);
        let userIdVal = "#" + Math.floor(10000 + Math.random() * 90000);

        await setDoc(doc(db, "users", firebaseUser.uid), {
            username: user,
            email: email,
            password: pass,
            myReferralCode: myCode,
            referralUid: refUid,
            mainBalance: 0,
            totalReferrals: 0,
            withdrawCount: 0,
            packageActive: false,
            userId: userIdVal,
            role: "user"
        });

        if(refUid) {
            let uplineDocRef = doc(db, "users", refUid);
            let uplineSnap = await getDoc(uplineDocRef);

            if(uplineSnap.exists()) {
                let uplineData = uplineSnap.data();
                let currentBalance = Number(uplineData.mainBalance || 0);
                let currentReferrals = Number(uplineData.totalReferrals || 0);

                await updateDoc(uplineDocRef, {
                    totalReferrals: currentReferrals + 1,
                    mainBalance: currentBalance + 50
                });
            }
        }

        showCustomAlert("Account Created Successfully! Please Login.", "login");
    } catch (error) {
        if (error.code === 'auth/email-already-in-use') {
            showCustomAlert("This email is already registered! Please login.", "login");
        } else if (error.code === 'auth/invalid-email') {
            showCustomAlert("Please enter a valid email address!");
        } else if (error.code === 'auth/weak-password') {
            showCustomAlert("Password should be at least 6 characters!");
        } else {
            showCustomAlert("Error: " + error.message);
        }
    } finally {
        btn.disabled = false;
        btn.innerText = "Create Account";
    }
}

window.login = async function() {
    let email = document.getElementById("lemail").value.trim();
    let pass = document.getElementById("lpass").value.trim();
    let btn = document.getElementById("loginBtn");

    if(email === "" || pass === ""){
        showCustomAlert("Please enter email and password!");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Logging in...";

    try {
        let userCredential = await signInWithEmailAndPassword(auth, email, pass);
        let firebaseUser = userCredential.user;

        let userDocRef = doc(db, "users", firebaseUser.uid);
        let userDoc = await getDoc(userDocRef);

        let userName = email.split('@')[0];
        let myCode = "EH" + Math.floor(1000 + Math.random() * 9000);
        let userIdVal = "#" + Math.floor(10000 + Math.random() * 90000);
        let userBalance = 0;

        if (!userDoc.exists()) {
            await setDoc(userDocRef, {
                username: userName,
                email: email,
                password: pass,
                myReferralCode: myCode,
                referralUid: "",
                mainBalance: 0,
                totalReferrals: 0,
                withdrawCount: 0,
                packageActive: false,
                userId: userIdVal,
                role: "user"
            });
        } else {
            let data = userDoc.data();
            userName = data.username || userName;
            myCode = data.myReferralCode || myCode;
            userIdVal = data.userId || userIdVal;
            userBalance = Number(data.mainBalance || 0);
        }

        localStorage.setItem("userName", userName);
        localStorage.setItem("user", userName);
        localStorage.setItem("myReferralCode", myCode);
        localStorage.setItem("email", email);
        localStorage.setItem("userId", userIdVal);
        localStorage.setItem("mainBalance", userBalance);
        localStorage.setItem("firebaseUid", firebaseUser.uid);

        window.location.href = "dashboard.html";
    } catch (error) {
        showCustomAlert("Wrong Email or Password!");
    } finally {
        btn.disabled = false;
        btn.innerText = "Login";
    }
}

window.forgotPassword = function() {
    showCustomPrompt(async (email) => {
        if(!email) return;

        try {
            let q = query(collection(db, "users"), where("email", "==", email.trim()));
            let querySnapshot = await getDocs(q);

            if(querySnapshot.empty){
                showCustomAlert("No account found with this email!");
            } else {
                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    showCustomAlert("Account Details Found!\n\nUsername: " + data.username + "\nPassword: " + data.password);
                });
            }
        } catch (error) {
            showCustomAlert("Error: " + error.message);
        }
    });
}

// 3D Flip Transition Functions
window.showLogin = function(){
    document.getElementById("cardWrapper").classList.add("rotate");
}

window.showSignup = function(){
    document.getElementById("cardWrapper").classList.remove("rotate");
}
</script>

</body>
</html>
