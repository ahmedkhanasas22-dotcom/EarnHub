<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<title>EarnHub Referral</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{ box-sizing:border-box; }
body{
margin:0;
max-width:430px;
margin:auto;
font-family:Arial;
background:#050505;
color:white;
padding-bottom: 30px;
}
.header{ text-align:center; padding:20px; }
.logo{
width:80px;
height:80px;
margin:auto;
border-radius:50%;
background:linear-gradient(145deg,#00ffff,#003333);
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 0 20px cyan;
border:3px solid white;
}
.logo-inner{ text-align:center; color:#000; font-weight:bold; }
.icon{ font-size:24px; }
.name{ font-size:12px; }
.container{ padding:15px; }
.card{
background:#111;
padding:20px;
border-radius:20px;
box-shadow:0 0 15px cyan;
text-align:center;
margin-bottom:15px;
}
.title{ color:#00ffff; font-size:22px; font-weight:bold; }
.link{
background:#222;
padding:12px;
border-radius:15px;
margin:15px 0;
word-break:break-all;
font-size: 13px;
color: #00ffff;
}
button{
width:100%;
padding:12px;
border:none;
border-radius:25px;
background:#00ffff;
font-weight:bold;
cursor: pointer;
color: #000;
}

/* Levels Box Styling */
.levels-container {
    text-align: left;
    margin-top: 15px;
}
.level-item {
    background: #1a1a1a;
    border: 1px solid #333;
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
}
.level-info span { color: #00ffff; font-weight: bold; }
.level-status { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
.status-completed { background: rgba(0,255,153,0.2); color: #00ff99; border: 1px solid #00ff99; }
.status-pending { background: rgba(255,77,77,0.2); color: #ff4d4d; border: 1px solid #ff4d4d; }

/* کسٹم پاپ اپ ماڈل ڈیزائن */
.custom-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    padding: 15px;
}
.custom-modal-box {
    background: #161b22;
    width: 100%;
    max-width: 320px;
    border-radius: 16px;
    border: 2px solid #00ffff;
    padding: 20px;
    text-align: center;
    box-shadow: 0 0 25px rgba(0,255,255,0.3);
}
.custom-modal-text {
    color: #fff;
    font-size: 14px;
    margin-bottom: 20px;
    line-height: 1.4;
}
.custom-modal-btn {
    background: linear-gradient(135deg, #00ffff, #0048ff);
    color: #000;
    border: none;
    padding: 8px 25px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    width: auto;
}
</style>
</head>
<body>

<div class="header">
<div class="logo">
<div class="logo-inner">
<div class="icon">◆</div>
<div class="name">EarnHub</div>
</div>
</div>
</div>

<div class="container">
<div class="card">
<div class="title">Referral Program</div>
<p>Earn <span class="currency-price" data-base-usd="50">Rs. 50</span> when your referred member buys a package</p>

<div class="link" id="refLink">
Loading link...
</div>

<button onclick="copyLink()">
Copy Referral Link
</button>
</div>

<div class="card">
<h3>Referral Earnings</h3>
<h1 id="refEarnings" class="currency-price" style="color:#00ff99;" data-base-usd="0">Rs. 0</h1>
</div>

<!-- 10 Levels Section -->
<div class="card">
<h3 style="color:#00ffff; margin-bottom: 10px;">10-Level Referral System</h3>
<p style="font-size: 11px; color: #aaa; margin-bottom: 15px;">Package purchase ke baad members count honge</p>

<div class="levels-container" id="levelsList">
    <!-- Firebase se data aane ke baad yahan levels dynamically generate honge -->
</div>
</div>
</div>

<!-- کسٹم الرٹ ماڈل HTML -->
<div class="custom-modal" id="customAlertModal">
    <div class="custom-modal-box">
        <div class="custom-modal-text" id="customAlertMessage">Referral link copied successfully!</div>
        <button class="custom-modal-btn" onclick="closeCustomAlert()">OK</button>
    </div>
</div>

<script>
/* ==================================================
   CURRENCY CONVERSION LOGIC (GLOBAL SETTING)
================================================== */
const countriesCurrencies = {
    PKR: { symbol: "Rs. ", rate: 1, decimals: 0 },
    USD: { symbol: "$", rate: 0.0036, decimals: 2 },
    INR: { symbol: "₹", rate: 0.30, decimals: 0 },
    EUR: { symbol: "€", rate: 0.0033, decimals: 2 },
    GBP: { symbol: "£", rate: 0.0028, decimals: 2 },
    AED: { symbol: "AED ", rate: 0.013, decimals: 2 },
    SAR: { symbol: "SAR ", rate: 0.013, decimals: 2 }
};

function applyGlobalCurrencyToElements() {
    const selectedCurrKey = localStorage.getItem('selectedCurrency') || 'PKR';
    const currObj = countriesCurrencies[selectedCurrKey] || countriesCurrencies['PKR'];
    
    const priceElements = document.querySelectorAll('.currency-price');
    priceElements.forEach(el => {
        const baseVal = parseFloat(el.getAttribute('data-base-usd'));
        if (!isNaN(baseVal)) {
            const convertedVal = baseVal * currObj.rate;
            let formattedNum = convertedVal.toLocaleString('en-US', {
                minimumFractionDigits: currObj.decimals,
                maximumFractionDigits: currObj.decimals
            });
            el.innerText = currObj.symbol + formattedNum;
        }
    });
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBsXMyLONHGs0R7wzAz5MI7ozw0SRBYEvI",
    authDomain: "earnhub-55c59.firebaseapp.com",
    projectId: "earnhub-55c59",
    storageBucket: "earnhub-55c59.firebasestorage.app",
    messagingSenderId: "636270810711",
    appId: "1:636270810711:web:da2bb0625524bcddc27512"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let globalRefCode = "";

window.showCustomAlert = function(msg) {
    let msgBox = document.getElementById("customAlertMessage");
    if(msgBox) msgBox.innerText = msg;
    document.getElementById("customAlertModal").style.display = "flex";
}

window.closeCustomAlert = function() {
    document.getElementById("customAlertModal").style.display = "none";
}

onAuthStateChanged(auth, async (user) => {
    if (user) {
        try {
            let userRef = doc(db, "users", user.uid);
            let userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                let data = userSnap.data();
                globalRefCode = user.uid;
                
                let level1Count = Number(data.level1Count || data.totalReferrals || 0);
                let totalEarnings = level1Count * 50;

                let earnElem = document.getElementById("refEarnings");
                earnElem.setAttribute("data-base-usd", totalEarnings);
                applyGlobalCurrencyToElements();

                renderLevels(level1Count);
            }
        } catch (err) {
            console.log("Error fetching referral data:", err);
        }
    } else {
        globalRefCode = localStorage.getItem("myUid") || localStorage.getItem("myReferralCode") || "EarnHubUser";
        let localRefs = Number(localStorage.getItem("totalReferrals") || 0);
        let totalEarnings = localRefs * 50;

        let earnElem = document.getElementById("refEarnings");
        earnElem.setAttribute("data-base-usd", totalEarnings);
        applyGlobalCurrencyToElements();

        renderLevels(localRefs);
    }

    let currentPath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
    let refUrl = window.location.origin + currentPath + "index.html?ref=" + globalRefCode;
    document.getElementById("refLink").innerText = refUrl;
    window.fullRefUrl = refUrl;
});

function renderLevels(refCount) {
    let levelsContainer = document.getElementById("levelsList");
    levelsContainer.innerHTML = "";

    let requiredMembers = 2;

    for (let i = 1; i <= 10; i++) {
        if (i > 1) {
            requiredMembers *= 2;
        }

        let isCompleted = refCount >= requiredMembers;
        let statusClass = isCompleted ? "status-completed" : "status-pending";
        let statusText = isCompleted ? "Completed" : "Locked";

        let itemHTML = `
            <div class="level-item">
                <div class="level-info">
                    <strong>Level ${i}</strong><br>
                    <span style="font-size:11px; color:#aaa;">Target: ${requiredMembers} Active Members</span>
                </div>
                <div>
                    <span style="font-size:12px; margin-right:8px;">${Math.min(refCount, requiredMembers)}/${requiredMembers}</span>
                    <span class="level-status ${statusClass}">${statusText}</span>
                </div>
            </div>
        `;
        levelsContainer.innerHTML += itemHTML;
    }
}

window.copyLink = function() {
    if (window.fullRefUrl) {
        navigator.clipboard.writeText(window.fullRefUrl);
        showCustomAlert("Referral link copied successfully!");
    }
}
</script>

</body>
</html>
