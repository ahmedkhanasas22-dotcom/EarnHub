<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnHub - یوزر ڈیش بورڈ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #007bff;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        .welcome-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-box h3 {
            margin: 0;
            color: #555;
            font-size: 16px;
        }
        .stat-box p {
            margin: 10px 0 0;
            font-size: 22px;
            font-weight: bold;
            color: #007bff;
        }
        .nav-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        .nav-buttons a {
            background: #28a745;
            color: white;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .nav-buttons a:hover {
            background: #218838;
        }
        .logout-btn {
            background: #dc3545 !important;
        }
        .logout-btn:hover {
            background: #c82333 !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>EarnHub ڈیش بورڈ</h2>
        <span id="userUUID">ID: --</span>
    </div>

    <div class="container">
        <div class="welcome-card">
            <h3 id="userName">خوش آمدید، ---</h3>
            <p>ای میل: <span id="userEmail">---</span></p>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <h3>کل بیلنس (Balance)</h3>
                <p id="userBalance">Rs. 0</p>
            </div>
            <div class="stat-box">
                <h3>کل ڈیپازٹ</h3>
                <p id="totalDeposit">Rs. 0</p>
            </div>
            <div class="stat-box">
                <h3>کل ودڈرا</h3>
                <p id="totalWithdraw">Rs. 0</p>
            </div>
            <div class="stat-box">
                <h3>ایکٹو پلان</h3>
                <p id="activePlanName" style="font-size: 18px; color: #e67e22;">کوئی پلان نہیں</p>
            </div>
        </div>

        <div class="nav-buttons">
            <a href="plans.html">انویسٹمنٹ پلانز</a>
            <a href="deposit.html">ڈیپازٹ کریں</a>
            <a href="withdraw.html">ودڈرا کریں</a>
            <a href="claim.html">روزانہ کلیم</a>
            <a href="referral.html">ریفرل سسٹم</a>
            <a href="#" class="logout-btn" onclick="logout()">لاگ آؤٹ</a>
        </div>
    </div>

    <script>
        // چیک کریں کہ یوزر لاگ ان ہے یا نہیں
        const currentUser = JSON.parse(localStorage.getItem('current_user'));
        
        if (!currentUser) {
            alert('براہ کرم پہلے لاگ ان کریں!');
            window.location.href = 'login.html';
        } else {
            // ڈیش بورڈ میں ڈیٹا شو کرنا
            document.getElementById('userName').innerText = 'خوش آمدید، ' + currentUser.fullname;
            document.getElementById('userEmail').innerText = currentUser.email;
            document.getElementById('userUUID').innerText = 'ID: ' + currentUser.userId;
            document.getElementById('userBalance').innerText = 'Rs. ' + (currentUser.balance || 0);
            document.getElementById('totalDeposit').innerText = 'Rs. ' + (currentUser.totalDeposit || 0);
            document.getElementById('totalWithdraw').innerText = 'Rs. ' + (currentUser.totalWithdraw || 0);
            
            if(currentUser.activePlan) {
                document.getElementById('activePlanName').innerText = currentUser.activePlan;
            }
        }

        function logout() {
            localStorage.removeItem('current_user');
            window.location.href = 'login.html';
        }
    </script>

</body>
</html>
